<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Frontieres : jeu original de grande strategie, campagne solo de 1936 dans votre navigateur.">
<title>Fronti&egrave;res 1.13 &mdash; Grande strat&eacute;gie solo</title>
<style><!-- @include src/styles.css --></style>
</head>
<body>
<header id="topbar">
  <div class="brand"><div class="badge-square">F</div><div><div class="brand-title">FRONTI&Egrave;RES</div><div class="brand-sub">GRAND STRATEGY / SOLO</div></div></div>
  <div class="clock"><div class="clock-date" id="clock-date">1 janvier 1936<small>CAMPAGNE EN PAUSE</small></div><button id="pause" data-a="pause" title="Pause (Espace)" aria-label="Pause ou reprendre">&#9654;</button><div id="speeds" class="row" style="gap:3px"></div></div>
  <div class="top-actions"><span class="version">VERSION 1.13 / SOLO</span><button data-a="save" title="Exporter la sauvegarde"><span class="save-text">Sauver</span><span data-icon="save"></span></button><button data-a="load" title="Charger une sauvegarde"><span data-icon="folder"></span></button><button data-a="help" title="Manuel"><span data-icon="help"></span></button><button data-a="menu" title="Menu"><span data-icon="menu"></span></button></div>
</header>
<div id="resources"><div class="national-title" id="nation-banner"></div><div class="resource-strip" id="resource-strip"></div></div>
<div id="layout">
<nav id="rail" aria-label="Panneaux du gouvernement"></nav>
<aside id="panel" aria-label="Panneau de gestion"></aside>
<main id="maparea" aria-label="Carte strategique">
  <canvas id="map" aria-label="Carte du monde interactive"></canvas>
  <div id="map-head"><div class="eyebrow">TH&Eacute;&Acirc;TRE STRAT&Eacute;GIQUE</div><div class="theatre-title" id="theatre-name">Europe occidentale</div><div class="map-micro" id="map-caption">01 / CARTE POLITIQUE</div></div>
  <div class="map-search"><input id="search" placeholder="Pays, ville ou province..." aria-label="Rechercher sur la carte" autocomplete="off"><div id="search-results"></div></div>
  <section id="inspector" aria-label="Province selectionnee"></section>
  <div id="operation-toolbar" hidden></div><div id="campaign-shortcut"><button data-a="tab" data-p="%7B%22id%22%3A%22campaign%22%7D">DOSSIER DE CAMPAGNE</button><button data-a="atlas">ATLAS HISTORIQUE</button></div><div id="selection-toolbar"></div>
  <div id="map-modes"></div><div id="map-legend" class="map-legend"></div>
  <div class="map-zoom"><button data-a="home" title="Votre capitale"><span data-icon="home"></span></button><button data-a="zoomIn" title="Zoom avant">+</button><button data-a="zoomOut" title="Zoom arriere">&minus;</button><button data-a="world" title="Vue mondiale"><span data-icon="globe"></span></button></div>
  <div id="minimap-box"><canvas id="minimap" width="404" height="230" aria-label="Minicarte du monde"></canvas><div class="minimap-caption">ATLAS MONDIAL</div></div>
  <div id="army-tray" aria-label="Armees nationales"></div>
  <footer id="map-footer"><span id="map-hint">Glisser : d&eacute;placer / Maj + glisser : s&eacute;lection / Clic droit : ordre</span><span id="engine-status">MOTEUR EN INITIALISATION</span></footer>
</main>
</div>
<div id="tooltip"></div><div id="toasts" class="toast-stack" role="status" aria-live="polite"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Fenetre de campagne"></div></div>
<div class="boot-error" id="boot-error"></div>
<input type="file" id="save-file" accept=".json,application/json" hidden><input type="file" id="mod-file" accept=".json,application/json" hidden>
<script id="world-data" type="application/json"><!-- @include data/world.json --></script>
<script id="catalog-data" type="application/json"><!-- @include data/catalog.json --></script>
<script id="portrait-data" type="application/json"><!-- @include data/portraits.json --></script>
<script id="people-data" type="application/json"><!-- @include data/people.json --></script>
<script id="sources-data" type="application/json"><!-- @include data/sources.json --></script>
<script id="map-demo-data" type="application/json"><!-- @include data/map-demo.json --></script>
<script><!-- @include src/systems.js --></script>
<script><!-- @include src/engine.js --></script>
<script><!-- @include src/worker.js --></script>
<script><!-- @include src/ui.js --></script>
<script><!-- @include src/ui16.js --></script>
<script><!-- @include src/i18n.js --></script>
</body>
</html>
