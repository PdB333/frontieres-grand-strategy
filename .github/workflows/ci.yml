name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: for f in src/*.js tools/*.mjs; do node --check "$f"; done

      - name: index.html matches src/ and data/
        run: node tools/build.mjs --check

      - name: Engine smoke test
        run: node tools/smoke.mjs 60
